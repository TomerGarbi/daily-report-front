# Dependabot configuration for the DailyReport frontend (Next.js 15 / React 19).
#
# Weekly cadence keeps noise low; PRs are grouped so a bundle of related
# updates (e.g. all Radix packages) arrive as a single reviewable PR.
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # ── npm (application dependencies) ──────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      # Roll the entire Radix UI family together — they always release in
      # lockstep and their diffs are boring, so one PR = one review.
      radix-ui:
        patterns:
          - "@radix-ui/*"
      # Next.js + React ecosystem updates land together so they can be
      # validated as one coherent upgrade.
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "eslint-config-next"
      # Test / lint tooling.
      tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "@typescript-eslint/*"
          - "prettier*"
      # Charts — group both libraries + their type packages so we don't get
      # 4 separate PRs every week.
      charts:
        patterns:
          - "recharts"
          - "chart.js"
          - "react-chartjs-2"

  # ── GitHub Actions workflows ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
